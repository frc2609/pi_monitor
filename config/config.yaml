# Health monitor settings.
#
# Everything team-specific or robot-specific lives here, never in the code.
# Version controlled, so a fresh Pi works straight from a clone.

# The only place the team number appears in this project.
team: 2609

# Seconds between samples. Each sample runs four vcgencmd commands, so time
# those before going below about 0.2s.
interval_s: 1.0

log_level: INFO      # DEBUG / INFO / WARNING / ERROR. --verbose overrides this.


# --- NetworkTables -------------------------------------------------------
nt:
  # server = this Pi hosts NetworkTables (bench, no roboRIO present)
  # client = this Pi connects to the roboRIO (on the robot)
  mode: server

  # Explicit host or IP, overriding the team lookup. Leave null on the robot.
  server: null

  enabled: true
  table: Vision/health


# --- Where records are kept ----------------------------------------------
storage:
  # systemd creates these. If you change them, change the unit file to match.
  state_dir: /var/lib/health_monitor
  log_dir: /var/log/health_monitor     # null = journal only, no file on disk

  # A match is under 3 minutes, and whatever is still in RAM when the power
  # cuts is lost. Anything failing the health check flushes immediately.
  flush_interval_s: 10.0

  # A "still alive" record even when nothing changes. This only affects the
  # log and the file - the NetworkTables heartbeat counter updates every
  # sample, so live dead-process detection is already 1s.
  heartbeat_log_s: 10.0

  # Safety cap on the RAM buffer. Only fills if the disk stops accepting writes.
  buffer_max_records: 2000

  # Delete the oldest records once the log directory passes this. 0 disables.
  #
  # By size rather than a file count, because a boot that browns out after
  # twenty seconds writes almost nothing. A brownout storm makes many tiny
  # files, and keeping "the last 30 files" would throw away every real boot
  # to hold onto fragments - exactly when you need the history. 50MB is
  # hundreds of normal boots.
  #
  # The current boot's file and the previous boot's are never deleted.
  max_log_mb: 50


# --- Other services to keep an eye on ------------------------------------
services:
  # Watched, not managed - we only report whether they are running.
  # A service that is not installed reports as unknown, not as a fault.
  watch:
    - photonvision

  # systemctl is slow, so check every Nth sample. At interval_s 1.0 that is 5s.
  check_every_n: 5


# --- When to call a sample bad -------------------------------------------
# Crossing any of these logs at ERROR and flushes to disk at once.
thresholds:
  temp_warn_c: 70.0            # warning only
  temp_crit_c: 80.0            # Pi 5 starts throttling itself around here
  volts_min: 4.75              # 5V rail below this means a supply problem
  volts_prealarm: 4.90         # not a fault yet, but flush to disk now
  mem_available_min_mb: 200.0
  disk_free_min_mb: 500.0


# --- How much a reading must move to count as a change -------------------
# Measured from the last value LOGGED, which keeps sensor noise out of the log.
#
# Set from real jitter on a Pi, not from theory. At idle the PMIC wanders about
# 0.04V and 0.4W on its own, so anything tighter logs almost every sample.
# Raise one if that reading is chattering; lower it if you are missing movement
# you care about.
deltas:
  temp_c: 4.0        # idles with a ~2.2C swing, so 2.0 oscillated across it
  volts: 0.05
  power_w: 0.5
  mem_mb: 100.0
  disk_mb: 100.0

# cpu_mhz has no entry on purpose. An idle Pi scales between 1500 and 2400MHz
# constantly, so no tolerance works - it would log on every idle and every wake.
# It is still recorded and published, it just does not trigger a line.
# Throttling shows up in the throttle bits, which log immediately anyway.
