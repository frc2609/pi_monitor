# Devices to pull logs from. Used by fetch_logs.py, which runs on your laptop. Nothing here is secret - hostnames and paths only.
#
# Each section is a target. The section name is also the folder it lands in
# under fetched_logs/, so name it after the device: 2609_pi_1 for 2609-pi-1.
# Underscores because it is a folder name; the real hostname is on `host`.
#
# `paths` and `units` are one per line, indented.
# Paths that do not exist on a device are reported and skipped, so it is fine
# to list both the USB and the internal location.

[2609_pi_1]
host  = admin@2609-pi-1.local
paths = /var/log/health_monitor
        /var/lib/health_monitor/boot_state.json
units = health_monitor
        photonvision

# A second vision Pi, when there is one. Delete or add as the robot changes.
# [2609_pi_2]
# host  = admin@10.26.9.12
# paths = /var/log/health_monitor
#         /var/lib/health_monitor/boot_state.json
# units = health_monitor
#         photonvision

[rio]
# The roboRIO is just another SSH host. lvuser has no password by default.
# DataLogManager writes to a `logs` folder on a FAT32 USB stick if one is
# attached, otherwise /home/lvuser/logs. Phoenix 6 .hoot files go to the same
# place. Both are listed; whichever is missing is skipped.
host  = lvuser@10.26.9.2
paths = /u/logs
        /home/lvuser/logs
# NI Linux RT does not use systemd units the way the Pi does, so no journals.
units =
